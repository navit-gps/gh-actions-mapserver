name: Prepare complete ocean coverage
description: Use the same complete global land snapshot for every regional map.
inputs:
  source:
    description: Regional OSM PBF input
    required: true
  land-cache-key:
    description: Exact global land cache key selected by the prepare job
    required: true
  land-sha256:
    description: Expected global land shapefile hash
    required: true
runs:
  using: composite
  steps:
    - name: Install ocean preparation tools
      shell: bash
      run: |
        apt-get update
        apt-get install -y --no-install-recommends python3-shapely python3-pyshp osmium-tool zstd
    - uses: actions/cache/restore@v4
      with:
        path: .ocean-land
        key: ${{ inputs.land-cache-key }}
        fail-on-cache-miss: true
    - name: Verify land snapshot and prepare water polygons
      shell: bash
      env:
        SOURCE_PBF: ${{ inputs.source }}
        LAND_SHA256: ${{ inputs.land-sha256 }}
      run: |
        printf '%s  %s\n' "$LAND_SHA256" .ocean-land/land-polygons-split-3857/land_polygons.shp | sha256sum --check
        mkdir -p .ocean-tools
        wget -q -O .ocean-tools/coastline-polygons.py https://raw.githubusercontent.com/navit-gps/navit/ec92f6602e2c8f03956a8ee269710862357d3e43/contrib/coastline-polygons.py
        python3 "$GITHUB_ACTION_PATH/prepare.py" "$SOURCE_PBF"
