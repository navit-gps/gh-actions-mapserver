# Compares the old maptool with the libosmium maptool on one map of France.
#
# Structure:
#   build     builds both versions from source with the same options
#   download  fetches the extract once and shares it as an artifact
#   convert   two jobs in parallel, one for each version, same input file
#   compare   compares the two maps and reports the time of every phase
#
# Two jobs on two fresh runners give a fair measurement. Both start with an
# empty page cache and read the same bytes. A single job would give the second
# conversion the extract from memory, and that difference is large: a local
# pair of runs reported phase 6 as 5.7 times faster for that reason alone.
#
# The prebuilt image ghcr.io/navit-gps/navit/maptool:trunk is not used, because
# it may carry other compiler options and would make the times hard to compare.

name: France A/B (old maptool against libosmium)

env:
  MAPTOOL_OPTS: --64bit --slice-size 6442450944

on:
  push:
    branches:
      - libosmium-ab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: trunk
            ref: trunk
            deps: libprotobuf-c-dev protobuf-c-compiler
          - name: libosmium
            ref: maptool-libosmium
            deps: libosmium2-dev libprotozero-dev
    steps:
      - name: Check out navit at ${{ matrix.ref }}
        uses: actions/checkout@v4
        with:
          repository: navit-gps/navit
          ref: ${{ matrix.ref }}

      - name: Install the build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential gettext \
            libglib2.0-dev zlib1g-dev libexpat1-dev libbz2-dev libpng-dev \
            ${{ matrix.deps }}

      - name: Build maptool
        run: |
          mkdir build && cd build
          cmake -DBUILD_MAPTOOL=ON -DSAMPLE_MAP=OFF ..
          cmake --build . --target maptool -j"$(nproc)"
          # A missing dependency disables BUILD_MAPTOOL and leaves no binary.
          test -x navit/maptool/maptool

      - name: Pack maptool
        run: |
          cd build
          mkdir -p dist
          cp navit/maptool/maptool navit/libnavit_core.so dist/
          tar czf ../maptool-${{ matrix.name }}.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: maptool-${{ matrix.name }}
          path: maptool-${{ matrix.name }}.tar.gz
          retention-days: 5

  download:
    runs-on: ubuntu-latest
    steps:
      - name: Download the extract of France
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends aria2
          # Geofabrik limits one connection, so use several.
          aria2c -x8 -s8 --file-allocation=none --console-log-level=warn \
            -o france.osm.pbf \
            https://download.geofabrik.de/europe/france-latest.osm.pbf
          ls -la france.osm.pbf
          md5sum france.osm.pbf | tee france.md5

      # Both conversions read this artifact, so the data cannot explain a
      # difference between them.
      - uses: actions/upload-artifact@v4
        with:
          name: france-pbf
          path: |
            france.osm.pbf
            france.md5
          retention-days: 1
          compression-level: 0

  convert:
    needs: [build, download]
    runs-on: ubuntu-latest
    timeout-minutes: 200
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: trunk
            extra: --protobuf
          - name: libosmium
            extra: ''
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: france-pbf

      - uses: actions/download-artifact@v4
        with:
          name: maptool-${{ matrix.name }}

      - name: Prepare
        run: |
          mkdir -p "$RUNNER_TEMP/mt"
          tar xzf maptool-${{ matrix.name }}.tar.gz -C "$RUNNER_TEMP/mt"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 zlib1g libexpat1 libbz2-1.0 libpng16-16
          md5sum -c france.md5
          df -h . | tail -1

      - name: Convert with the ${{ matrix.name }} maptool
        env:
          LD_LIBRARY_PATH: ${{ runner.temp }}/mt
        run: |
          start=$(date +%s)
          "$RUNNER_TEMP/mt/maptool" $MAPTOOL_OPTS ${{ matrix.extra }} \
            -i france.osm.pbf map.bin > run.log 2>&1
          echo "seconds=$(( $(date +%s) - start ))" | tee timing.txt
          tail -2 run.log

      - name: Summarize the map
        run: |
          ls -la map.bin
          python3 - <<'EOF' | tee summary.txt
          import zipfile
          with zipfile.ZipFile('map.bin') as z:
              info = z.infolist()
          print(f'members={len(info)}')
          print(f'uncompressed={sum(i.file_size for i in info)}')
          print(f'index={"yes" if any(i.filename=="index" for i in info) else "no"}')
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.name }}
          path: |
            map.bin
            run.log
            timing.txt
            summary.txt
          retention-days: 3
          compression-level: 0

  compare:
    needs: convert
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: result-trunk
          path: old

      - uses: actions/download-artifact@v4
        with:
          name: result-libosmium
          path: new

      - name: Report the time of every phase
        run: |
          python3 - <<'EOF' | tee report.txt
          import re
          NAMES = {1:'read input',2:'resolve ways',3:'ways to pois',4:'split intersections',
                   5:'coastlines',6:'towns to countries',7:'sort countries',8:'turn restrictions',
                   9:'multipolygons',10:'assoc streets',11:'house numbers',12:'tiles',13:'assemble map'}
          def phases(path):
              t = open(path, errors='ignore').read()
              d = {int(n): int(m)*60+int(s) for n, m, s in re.findall(r'Phase (\d+): [a-z ]+?(\d+):(\d\d)', t)}
              keys = sorted(d)
              return {n: d[keys[i+1]] - d[n] for i, n in enumerate(keys[:-1])}, max(d.values())
          old, old_total = phases('old/run.log')
          new, new_total = phases('new/run.log')
          # Phase 13 uses the same code in both versions. Its ratio therefore
          # shows how much the two runners differ, and it turns the other
          # ratios into a value that does not depend on the runner.
          base = (old.get(13, 0) / new[13]) if new.get(13) else 1.0
          print(f'runner difference from phase 13: {base:.3f}\n')
          print(f'{"phase":<24}{"old":>7}{"new":>7}{"ratio":>8}{"normalized":>12}')
          for n in sorted(set(old) | set(new)):
              o, w = old.get(n, 0), new.get(n, 0)
              r = o / w if w else 0
              print(f'{n:2d} {NAMES.get(n,"?"):<21}{o:>6}s{w:>6}s'
                    f'{(f"{r:.2f}x" if w else "-"):>8}{(f"{r/base:.2f}x" if w and base else "-"):>12}')
          print(f'{"TOTAL":<24}{old_total:>6}s{new_total:>6}s'
                f'{old_total/new_total:>7.2f}x{old_total/new_total/base:>11.2f}x')
          EOF
          echo; echo "old summary:"; cat old/summary.txt
          echo; echo "new summary:"; cat new/summary.txt

      - name: Compare the two maps
        run: python3 scripts/cmp_itembin.py old/map.bin new/map.bin | tail -20

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: france-ab-report
          path: |
            report.txt
            old/run.log
            new/run.log
            old/summary.txt
            new/summary.txt
          retention-days: 14
