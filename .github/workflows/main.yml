    steps:
    - uses: actions/checkout@v4
    - name: Download and build maps
      uses: actions/github-script@v7
      with:
        script: |
          const {execFileSync} = require('child_process');

          const items = ${{ toJSON(matrix.items) }};
          const tag = `${{ needs.prepare.outputs.tag_name }}`;

          for (const it of items) {
            const pbf = `${it.name}-latest.osm.pbf`;
            const bin = `${it.out}-${tag}.bin`;

            execFileSync('wget', [
              '-4',
              '--tries=15',
              '--retry-connrefused',
              '--waitretry=35',
              '--retry-on-http-error=429,500,502,503,504',
              '-c',
              '--timeout=30',
              '--read-timeout=60',
              '-O', pbf,
              it.url,
            ], {stdio: 'inherit'});

            execFileSync('maptool', [
              '--64bit',
              '--protobuf',
              '--slice-size', '6442450944',
              '-i', pbf,
              bin,
            ], {stdio: 'inherit'});
          }
    - name: Upload artifacts
      if: ${{ !env.ACT }}
      uses: actions/github-script@v7
      with:
        retries: 3
        script: |
          const fs = require('fs');

          const items = ${{ toJSON(matrix.items) }};
          const tag = `${{ needs.prepare.outputs.tag_name }}`;

          for (const it of items) {
            const name = `${it.out}-${tag}.bin`;
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.prepare.outputs.id }},
              name,
              data: fs.readFileSync(name),
            });
          }
  post:
    runs-on: ubuntu-latest
    needs:
    - prepare
    - build
    steps:
    - uses: actions/checkout@v2
    - uses: actions/github-script@v7
      id: vars
      with:
        script: |
          github.rest.repos.updateRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            release_id: ${{needs.prepare.outputs.id}},
            draft: false,
          });
