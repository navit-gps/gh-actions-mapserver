name: Process Maps
env:
  GIT_EDITOR: true

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      id: ${{ steps.vars.outputs.id }}
      html_url: ${{ steps.vars.outputs.html_url }}
      upload_url: ${{ steps.vars.outputs.upload_url }}
      tag_name: ${{ steps.vars.outputs.tag_name }}
    steps:
    - uses: actions/checkout@v2
    - uses: actions/github-script@v7
      if: ${{ !env.ACT }}
      id: vars
      with:
        script: |
          tag = new Date().toISOString().slice(0, 10)
          release = await github.rest.repos.createRelease({
            owner: context.repo.owner,
            repo: context.repo.repo,
            tag_name: tag,
            draft: true,
            name: tag,
            body: "Automatically converted Maps",
          });
          const { id, html_url, upload_url } = release.data;
          core.setOutput('id', id);
          core.setOutput('html_url', html_url);
          core.setOutput('upload_url', upload_url);
          core.setOutput('tag_name', tag);
  build:
    needs: prepare
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/navit-gps/navit/maptool:trunk
    strategy:
      fail-fast: false
      max-parallel: 2
