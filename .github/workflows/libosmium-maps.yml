# Map generation with the libosmium based maptool.
#
# Pilot for navit-gps/navit PR 1604, which replaces the four hand-written OSM
# parsers of maptool with one libosmium handler. It covers France and Germany
# only. Other regions stay on main.yml until this pilot is complete.
#
# main.yml uses the prebuilt image ghcr.io/navit-gps/navit/maptool:trunk. No
# such image exists for the PR branch, because container.yml in navit builds
# the image only for a push to trunk. This workflow therefore builds maptool
# once and gives the binary to the map jobs as an artifact.

name: Process Maps (libosmium)

env:
  GIT_EDITOR: true
  # Branch or tag of navit-gps/navit that provides the libosmium maptool.
  NAVIT_REF: maptool-libosmium
  # Same options that main.yml uses, without --protobuf. maptool now detects
  # the format from the file name.
  MAPTOOL_OPTS: --64bit --slice-size 6442450944

on:
  # A manual start needs the workflow file on the default branch. This file is
  # on a branch, so a push to that branch starts the pilot. Delete this trigger
  # when the file reaches main.
  push:
    branches:
      - libosmium-maps
  workflow_dispatch:

jobs:
  maptool:
    runs-on: ubuntu-latest
    steps:
      - name: Check out navit at ${{ env.NAVIT_REF }}
        uses: actions/checkout@v4
        with:
          repository: navit-gps/navit
          ref: ${{ env.NAVIT_REF }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake build-essential gettext \
            libglib2.0-dev zlib1g-dev libexpat1-dev libbz2-dev \
            libpng-dev libosmium2-dev libprotozero-dev

      - name: Build maptool
        run: |
          mkdir build && cd build
          cmake -DBUILD_MAPTOOL=ON -DSAMPLE_MAP=OFF ..
          cmake --build . --target maptool -j"$(nproc)"

      - name: Check that maptool is the libosmium build
          # A build without libosmium keeps the old usage text and reports
          # BUILD_MAPTOOL as disabled. Stop here instead of in every map job.
        run: |
          cd build
          ./navit/maptool/maptool --help > usage.txt 2>&1 || true
          grep -q "detected from the file suffix" usage.txt
          echo "maptool reports libosmium input support"

      - name: Pack maptool
        run: |
          cd build
          mkdir -p dist
          cp navit/maptool/maptool dist/
          cp navit/libnavit_core.so dist/
          tar czf ../maptool.tar.gz -C dist .

      - uses: actions/upload-artifact@v4
        with:
          name: maptool
          path: maptool.tar.gz
          retention-days: 5

  france:
    needs: maptool
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        subregion: ["alsace","aquitaine","auvergne","basse-normandie","bourgogne","bretagne","centre","champagne-ardenne","corse","franche-comte","guadeloupe","guyane","haute-normandie","ile-de-france","languedoc-roussillon","limousin","lorraine","martinique","mayotte","midi-pyrenees","nord-pas-de-calais","pays-de-la-loire","picardie","poitou-charentes","provence-alpes-cote-d-azur","reunion","rhone-alpes"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-map
        with:
          region-path: europe/france
          subregion: ${{ matrix.subregion }}
          prefix: europe-france
          maptool-opts: ${{ env.MAPTOOL_OPTS }}

  # France as one map instead of 27 subregions. This needs much more room than a
  # subregion: about 5 GB for the extract, about 19 GB for the temporary files
  # and about 3.5 GB for the result. A runner does not have that much free space
  # at the start, so this job removes the large preinstalled toolchains first.
  france-full:
    needs: maptool
    runs-on: ubuntu-latest
    timeout-minutes: 350   # the limit of a job is 6 h
    steps:
      - name: Report and increase the free space
        run: |
          echo "before:"; df -h / /mnt 2>/dev/null || df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          echo "after:"; df -h / /mnt 2>/dev/null || df -h

      - uses: actions/download-artifact@v4
        with:
          name: maptool

      - name: Unpack maptool
        run: |
          mkdir -p "$RUNNER_TEMP/maptool"
          tar xzf maptool.tar.gz -C "$RUNNER_TEMP/maptool"
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 zlib1g libexpat1 libbz2-1.0 libpng16-16 aria2
          echo "LD_LIBRARY_PATH=$RUNNER_TEMP/maptool" >> "$GITHUB_ENV"
          echo "MAPTOOL=$RUNNER_TEMP/maptool/maptool" >> "$GITHUB_ENV"

      - name: Download the extract of France
        run: |
          # Geofabrik limits one connection, so use several.
          aria2c -x8 -s8 --file-allocation=none --console-log-level=warn \
            -o france-latest.osm.pbf \
            https://download.geofabrik.de/europe/france-latest.osm.pbf
          ls -la france-latest.osm.pbf

      - name: Build the map of France
        run: |
          out="europe-france-$(date -I).bin"
          echo "MAP=$out" >> "$GITHUB_ENV"
          start=$(date +%s)
          "$MAPTOOL" $MAPTOOL_OPTS -i france-latest.osm.pbf "$out"
          echo "maptool needed $(( $(date +%s) - start )) s for France"
          df -h . | tail -1

      - name: Check the map
        run: |
          ls -la "$MAP"
          python3 - "$MAP" <<'EOF'
          import sys, zipfile
          with zipfile.ZipFile(sys.argv[1]) as z:
              names = z.namelist()
          if 'index' not in names:
              sys.exit('no index member')
          # A country map of France has about 115000 members. A much smaller
          # number means that a phase gave up quietly.
          if len(names) < 50000:
              sys.exit(f'only {len(names)} members, expected about 115000')
          print(f'{sys.argv[1]}: {len(names)} members, index present')
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: europe-france-full
          path: ${{ env.MAP }}
          retention-days: 5
          compression-level: 0

  germany:
    needs: maptool
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        subregion: ["baden-wuerttemberg","bayern","berlin","brandenburg","bremen","hamburg","hessen","mecklenburg-vorpommern","niedersachsen","nordrhein-westfalen","rheinland-pfalz","saarland","sachsen-anhalt","sachsen","schleswig-holstein","thueringen"]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/build-map
        with:
          region-path: europe/germany
          subregion: ${{ matrix.subregion }}
          prefix: europe-germany
          maptool-opts: ${{ env.MAPTOOL_OPTS }}
